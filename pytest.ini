[pytest]
# Les fichiers test/test_*.py sont des scripts autonomes : chacun s'exécute
# de haut en bas et se termine par sys.exit(0) ou sys.exit(1). Pytest ne peut
# pas les importer comme des modules de test ordinaires (le sys.exit final
# arrêterait la collecte). test/conftest.py lance donc chaque script dans son
# propre processus et en fait un test pytest : un script = un test.
testpaths = test

# Les scripts de sim/, deploy/ et mon_app/ ne sont pas des tests pytest : ils
# demandent Isaac Sim ou se lancent à la main. Pytest n'y descend pas, même
# lancé depuis la racine avec « pytest . ».
norecursedirs = .* *.egg build dist venv node_modules sim deploy mon_app

# Marqueurs des tests qui demandent une ressource absente d'une machine
# ordinaire. Un script les déclare dans une ligne de commentaire
# « # pytest-marqueurs : isaac, gpu » (voir test/conftest.py) ; sans la
# ressource, il est sauté proprement au lieu d'échouer.
markers =
    isaac: demande Isaac Sim (module isaacsim importable)
    gpu: demande un GPU NVIDIA (commande nvidia-smi présente)
    gros_modele: télécharge ou charge un gros modèle (activer avec AXIS_OS_GROS_MODELES=1)
